name: Orin Nano Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # prepare ステージに相当
  prepare-job:
    # 登録したセルフホストランナー（Orin Nano）を指定
    runs-on: [self-hosted, OrinNano]
    steps:
      - name: Prepare step
        run: echo "Prepare before echo-job..."

  # build ステージに相当
  build-job:
    runs-on: [self-hosted, OrinNano]
    needs: prepare-job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile and Run on ARM board
        run: |
          echo "Compilation will begin on OrinNano."
          g++ main.cpp -o main
          ./main
