name: CI Example

on:
  push:
    branches: [ "main" ]

jobs:
  # prepare ステージに相当
  prepare-job:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare step
        run: echo "Prepare before echo-job..."

  # echo ステージに相当
  echo-job:
    runs-on: ubuntu-latest
    needs: prepare-job  # ここで prepare-job の完了を待つように指定
    steps:
      - name: Echo step
        run: echo "Ahoy! This is GitHub Actions!"
